name: Patch All Documents in iOS Backup

on:
  workflow_dispatch:
    inputs:
      zip_filename:
        description: 'Name of the uploaded backup zip file'
        required: true
        default: 'my_backup.zip'

jobs:
  patch-all-docs:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Unzip Backup Archive
        run: |
          # Uses the dynamic input provided when triggering the workflow
          echo "Unzipping ${{ github.event.inputs.zip_filename }}..."
          unzip "${{ github.event.inputs.zip_filename }}" -d extracted_backup/

      - name: Run Bulk Manifest Patcher Script
        run: |
          python3 update_backup.py "extracted_backup"

      - name: Package Modified Backup
        run: |
          cd extracted_backup
          zip -r ../modified_ios_backup.zip .
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-ios-backup
          path: modified_ios_backup.zip
